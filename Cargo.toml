[workspace]
resolver = "3"
members = ["crates/hayami-core", "crates/hayami-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/oshothebig/hayami"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
hayami-core = { path = "crates/hayami-core" }

[profile.release]
lto = "thin"
codegen-units = 1
