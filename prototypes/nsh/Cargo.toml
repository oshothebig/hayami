[package]
name = "hayami-nsh"
description = "One-screen pull request review prototype on Native Shell (issue #22)."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
env_logger = "0.11"
log = "0.4"
nsh-core = "=0.6.1"
nsh-base = "=0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.6.1", default-features = false, features = ["editor", "highlight"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.1", default-features = false, features = ["editor", "highlight"] }

[dev-dependencies]
nsh-engine = "=0.6.1"
nsh-testing = { version = "=0.6.1", features = ["live"] }
