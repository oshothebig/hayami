[package]
name = "hayami-core"
description = "GPUI-independent core of hayami: GitHub API, git, diff model and key handling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.90", default-features = false, features = ["sha1", "blob-diff", "revision", "blocking-http-transport-reqwest-rust-tls", "max-performance"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
