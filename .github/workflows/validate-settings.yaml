name: Validate Claude Code settings

on:
  pull_request:
    paths:
    - ".claude/**"
    - ".github/workflows/validate-settings.yaml"
  push:
    branches: [main]
    paths:
    - ".claude/**"
    - ".github/workflows/validate-settings.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.14"
    - run: pipx install check-jsonschema
    - name: Validate .claude/settings.json against its JSON schema
      run: |
        schema_url="$(jq -er '."$schema"' .claude/settings.json)"
        check-jsonschema --schemafile "$schema_url" .claude/settings.json
