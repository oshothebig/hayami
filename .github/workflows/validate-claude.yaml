name: Validate Claude Code settings

on:
  pull_request:
    paths:
    - ".claude/**"
    - ".github/workflows/validate-claude.yaml"
    - ".github/workflows/actions.lock"
    - "tools/claude/**"
    - "justfile"
    - "mise.toml"
  push:
    branches: [main]
    paths:
    - ".claude/**"
    - ".github/workflows/validate-claude.yaml"
    - ".github/workflows/actions.lock"
    - "tools/claude/**"
    - "justfile"
    - "mise.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install just
      uses: jdx/mise-action@v5.2.10
    - name: Validate .claude/settings.json against its JSON schema
      run: just validate-claude
